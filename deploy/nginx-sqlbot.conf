server {
  listen 5173;
  server_name _;

  add_header Access-Control-Allow-Origin $http_origin always;
  add_header Access-Control-Allow-Credentials "true" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  add_header Access-Control-Allow-Headers "Authorization, Content-Type, tenant-id, Tenant-Id, X-Tenant-Id, X-SQLBOT-TOKEN, X-Requested-With" always;
  add_header Vary Origin always;

  if ($request_method = OPTIONS) {
    return 204;
  }

  location /sqlbot/ {
    alias /usr/share/nginx/html/sqlbot/;
    try_files $uri $uri/ /sqlbot/index.html;
  }

  location /api/v1/ {
    proxy_pass http://127.0.0.1:8011/api/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /images/ {
    proxy_pass http://127.0.0.1:8012/images/;
    proxy_set_header Host $host;
  }

  location /admin-api/ {
    proxy_pass http://127.0.0.1:48080/admin-api/;
    proxy_set_header Host $host;
  }
}

location = /sqlbot-app { return 301 /sqlbot-app/; }
location /sqlbot-app/ {
    proxy_pass http://host.docker.internal:20188/sqlbot/;
    proxy_set_header Host $host;
}
location /api/v1/ {
    proxy_pass http://host.docker.internal:20186/api/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    add_header X-Accel-Buffering no;
}
location /images/ {
    proxy_pass http://host.docker.internal:20187/images/;
    proxy_set_header Host $host;
}

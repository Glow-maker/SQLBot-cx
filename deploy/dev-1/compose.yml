name: dev-1-sqlbot
services:
  backend:
    image: ${SQLBOT_BACKEND_IMAGE:?Specify a versioned image}
    container_name: dev-1-sqlbot-backend
    network_mode: host
    restart: unless-stopped
    env_file: /data/service/dev-1/sqlbot/backend.env
    volumes:
      - /data/service/dev-1/sqlbot/excel:/opt/sqlbot/data/excel
      - /data/service/dev-1/sqlbot/file:/opt/sqlbot/data/file
      - /data/service/dev-1/sqlbot/images:/opt/sqlbot/images
      - /data/service/dev-1/sqlbot/logs:/opt/sqlbot/app/logs
    mem_limit: 6g
    cpus: 3
  frontend:
    image: ${SQLBOT_FRONTEND_IMAGE:?Specify a versioned image}
    container_name: dev-1-sqlbot-frontend
    network_mode: host
    restart: unless-stopped
    volumes:
      - /data/service/dev-1/sqlbot/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 256m


server {
    listen 172.17.0.1:20188;
    server_name _;
    location /sqlbot/ {
        alias /usr/share/nginx/html/sqlbot/;
        try_files $uri $uri/ /sqlbot/index.html;
    }
    location = /sqlbot/index.html {
        alias /usr/share/nginx/html/sqlbot/index.html;
        add_header Cache-Control "no-cache";
    }
}


# Add these locations to the same nginx server block that serves the data-platform frontend.
# Browser entry: /sqlbot/
# SQLBot frontend container still listens on 127.0.0.1:5173 in host network mode.

location = /sqlbot {
  return 301 /sqlbot/;
}

location /sqlbot/ {
  proxy_pass http://127.0.0.1:5173/sqlbot/;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/v1/ {
  proxy_pass http://127.0.0.1:8011/api/v1/;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location /images/ {
  proxy_pass http://127.0.0.1:8012/images/;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

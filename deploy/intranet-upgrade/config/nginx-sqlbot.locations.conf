# 放入现有中台server块。先备份；已有同名location请合并，不能重复添加。
# 127.0.0.1仅适用于nginx与SQLBot同机。分机时换成现场实际SQLBot地址。
location /sqlbot-app/ {
    proxy_pass http://127.0.0.1:5173/sqlbot/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /api/v1/ {
    proxy_pass http://127.0.0.1:8011/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
}
# /sqlbot/chat/index由中台SPA现有try_files处理；不是5173服务的路径。
# 保留现有/admin-api/、DataEase和/images/代理，不覆盖nginx主配置。
